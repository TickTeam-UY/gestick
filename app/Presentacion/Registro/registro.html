<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GesTIck - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="registrostyle.css">
</head>
<body>


    <main>
        <section class="contenedor-registro">
            <div class="marco-registro">

   
                <div class="contenedor-logo">
                    <img class="logo-registro" src="/imagenes/logo-app.png" alt="Logo GesTIck">
                </div>

                <form action="procesar_registro.php" method="POST" name="datos_registro" onsubmit="
                    if (document.getElementById('contrasenia').value !== document.getElementById('repetir_contrasenia').value) {
                        alert('Las contraseñas no coinciden.');
                        return false;
                    }
                ">
                    <table class="tabla-registro">
                        <tr>
                            <th colspan="2">Crear un usuario</th>
                        </tr>

                        <tr>
                            <td>
                                <label for="nombre">Nombre</label>
                                <input type="text" id="nombre" name="nombre" maxlength="100" required>
                            </td>
                            <td>
                                <label for="apellido">Apellido</label>
                                <input type="text" id="apellido" name="apellido" maxlength="100" required>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="correo">Correo electrónico</label>
                                <input type="email" id="correo" name="correo" maxlength="254" required>
                            </td>
                            <td>
                                <label for="rol">Rol</label>
                                <select id="rol" name="rol" required>
                                    <option value="" selected disabled>Seleccione un rol</option>
                                    <option value="Docente">Docente</option>
                                    <option value="Tecnico">Técnico</option>
                                    <option value="Administrador">Administrador</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label for="contrasenia">Contraseña</label>
                                <input type="password" id="contrasenia" name="contrasenia" maxlength="72" required>
                            </td>
                            <td>
                                <label for="repetir_contrasenia">Repetir contraseña</label>
                                <input type="password" id="repetir_contrasenia" name="repetir_contrasenia" maxlength="72" required>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2" class="fila-boton">
                                <input type="submit" value="Registrar">
                            </td>
                        </tr>
                    </table>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>GesTIck - Sistema de Gestión de Recursos y Soporte de Informática</p>
    </footer>

</body>
</html>
